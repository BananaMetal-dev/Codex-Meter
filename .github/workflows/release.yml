name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Validate version
        shell: pwsh
        run: |
          [xml]$project = Get-Content CodexMeter.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and project version differ' }
      - name: Build and test
        shell: pwsh
        run: |
          ./Build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $p = Start-Process './bin/Release/net10.0-windows/CodexMeter.exe' -ArgumentList '--self-test' -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw 'Tests failed' }
      - name: Build installer
        shell: pwsh
        run: ./Build-Installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/CodexMeter-Setup.exe release/SHA256SUMS.txt --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
