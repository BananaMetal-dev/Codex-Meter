name: Public privacy scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-scan:
    name: Public privacy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan tracked files
        run: node scripts/check-public-privacy.mjs --all

      - name: Select commit range
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          echo "SCAN_RANGE=$range" >> "$GITHUB_ENV"

      - name: Scan commit identities
        run: node scripts/check-public-privacy.mjs --commits "$SCAN_RANGE"
